# Symfony Security: who is the user (authentication) and what may the user do (authorization).
# https://symfony.com/doc/current/security.html
security:
    # How passwords are hashed. "auto" takes the best algorithm of the PHP version and
    # hashes a password again at sign-in when the settings change.
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Where users come from: the table of App\Entity\User.
    # No "property": UserRepository::loadUserByIdentifier() finds the user (by email, in lower case).
    providers:
        app_users:
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_users

            # Sign-in: POST /api/login with {"email": "...", "password": "..."}.
            # On success the user is saved in the session, and the browser gets the session cookie.
            # https://symfony.com/doc/current/security.html#json-login
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                failure_handler: App\Security\LoginFailureHandler

            # Stops guessing of passwords: 5 failed sign-ins per minute for one email and IP address,
            # and 25 per minute for one IP address. Needs symfony/rate-limiter.
            # https://symfony.com/doc/current/security.html#limiting-login-attempts
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

            # Sign-out: POST /api/logout. LogoutSubscriber sets the answer (204).
            logout:
                path: api_logout

            # A second cookie that signs the user in again when the session is gone:
            # the session files of the server are lost at every deploy and every restart
            # (a free Render service stops after 15 minutes without requests, docs/tech/stack.md).
            # The cookie has the email, an end date and a signature made with APP_SECRET and the password hash:
            # nothing is saved in the database, and a new password makes old cookies invalid.
            # https://symfony.com/doc/current/security/remember_me.html
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 days
                always_remember_me: true
                secure: auto
                samesite: lax

    # The first rule that matches the path decides. Everything under /api needs a signed-in user,
    # except the endpoints in the first rule. The controllers check the role and the object (voters).
    access_control:
        - { path: '^/api/(health|login|logout|profile|teachers|invitations/accept)$', roles: PUBLIC_ACCESS }
        - { path: '^/api/', roles: ROLE_USER }

when@prod:
    security:
        firewalls:
            main:
                remember_me:
                    # Production is HTTPS only: the cookie is never sent over plain HTTP.
                    secure: true

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
