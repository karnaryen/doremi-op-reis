doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # The server version is in DATABASE_URL (serverVersion=...), see .env.

        # FrankenPHP keeps PHP running between requests (worker mode), so a database connection stays open.
        # A Neon free compute suspends after 5 minutes without queries and drops the connection
        # (https://neon.com/docs/introduction/scale-to-zero). A connection older than this number of seconds
        # is closed before the next request, and Doctrine opens a new one. Default: 600.
        idle_connection_ttl: 240

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
