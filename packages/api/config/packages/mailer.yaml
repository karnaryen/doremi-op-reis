# Symfony Mailer sends the invitation emails. https://symfony.com/doc/current/mailer.html
framework:
    mailer:
        dsn: '%env(MAILER_DSN)%'

when@test:
    framework:
        mailer:
            # Tests never send an email, also when MAILER_DSN is set: local Docker sets it to the mail catcher
            # (compose.override.yaml), and a real env var wins over .env.test. A test still sees every email
            # that the app wanted to send (assertEmailCount, getMailerMessage).
            dsn: 'null://null'
