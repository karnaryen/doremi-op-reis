---
# Production environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build:
      context: .
      target: frankenphp_prod
    environment:
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set}
      # A regular expression for the origin of the SPA, for example https://app\.example\.com
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?CORS_ALLOW_ORIGIN must be set}
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT must be set}
      R2_BUCKET: ${R2_BUCKET:?R2_BUCKET must be set}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID must be set}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY must be set}

  database:
    environment:
      # compose.yaml puts the same value into DATABASE_URL, so use only letters and digits:
      # other characters can break the URL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
